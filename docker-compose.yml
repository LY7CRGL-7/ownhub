services:
  postgres:
    image: postgres:16
    container_name: ownhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: personal_backend_hub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d personal_backend_hub"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pg_data:
