<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OwnHub - 短链接+工具箱</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e0e0e0;
        }

        .card h3 {
            color: #764ba2;
            margin: 15px 0 10px 0;
            font-size: 1.1rem;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 500;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: transform 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        .result {
            margin-top: 15px;
            padding: 12px;
            background: #f5f5f5;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            word-break: break-all;
            max-height: 200px;
            overflow-y: auto;
        }

        .result pre {
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .error {
            background: #fee;
            color: #c33;
            border-left: 3px solid #c33;
        }

        .success {
            background: #efe;
            color: #3c3;
            border-left: 3px solid #3c3;
        }

        .api-url {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }

        .short-link {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 12px;
            margin-top: 5px;
        }

        .short-link:hover {
            background: #764ba2;
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
            h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🚀 OwnHub - 短链接 + 工具箱</h1>

    <div class="grid">
        <!-- 短链接服务 -->
        <div class="card">
            <h2>🔗 短链接服务</h2>

            <!-- 创建短链接 -->
            <h3>📝 创建短链接</h3>
            <div class="form-group">
                <label>原始 URL *</label>
                <input type="url" id="createUrl" placeholder="https://example.com/very/long/url">
            </div>
            <div class="form-group">
                <label>自定义 Slug (可选)</label>
                <input type="text" id="createSlug" placeholder="my-custom-slug">
            </div>
            <div class="form-group">
                <label>描述 (可选)</label>
                <input type="text" id="createDesc" placeholder="链接描述">
            </div>
            <button onclick="createShortLink()">✨ 创建短链接</button>
            <div id="createResult" class="result" style="display:none"></div>

            <!-- 查询短链接详情 -->
            <h3 style="margin-top: 30px;">🔍 查询短链接详情</h3>
            <div class="form-group">
                <label>短链接 Code</label>
                <input type="text" id="getCode" placeholder="例如: abc123">
            </div>
            <button onclick="getShortDetail()">📖 查询详情</button>
            <div id="getResult" class="result" style="display:none"></div>
        </div>

        <!-- 工具箱 -->
        <div class="card">
            <h2>🛠️ 工具箱</h2>

            <!-- Ping -->
            <h3>🏓 Ping</h3>
            <button onclick="ping()">🏓 Ping 服务</button>
            <div id="pingResult" class="result" style="display:none"></div>

            <!-- 时间戳 -->
            <h3 style="margin-top: 20px;">⏰ 时间戳</h3>
            <div class="form-group">
                <label>时区 (可选)</label>
                <input type="text" id="timezone" placeholder="Asia/Shanghai">
            </div>
            <button onclick="getTimestamp()">🕐 获取时间戳</button>
            <div id="timestampResult" class="result" style="display:none"></div>

            <!-- 生成 Token -->
            <h3 style="margin-top: 20px;">🔑 生成 Token</h3>
            <div class="form-group">
                <label>长度 (默认32)</label>
                <input type="number" id="tokenLen" placeholder="32" value="32">
            </div>
            <button onclick="generateToken()">🎲 生成 Token</button>
            <div id="tokenResult" class="result" style="display:none"></div>

            <!-- 文本摘要 -->
            <h3 style="margin-top: 20px;">📊 文本摘要 (Digest)</h3>
            <div class="form-group">
                <label>文本内容</label>
                <textarea id="digestText" rows="3" placeholder="请输入要计算摘要的文本..."></textarea>
            </div>
            <div class="form-group">
                <label>算法</label>
                <select id="digestAlgo">
                    <option value="md5">MD5</option>
                    <option value="sha1">SHA1</option>
                    <option value="sha256" selected>SHA256</option>
                    <option value="sha512">SHA512</option>
                </select>
            </div>
            <button onclick="digestText()">🔐 计算摘要</button>
            <div id="digestResult" class="result" style="display:none"></div>
        </div>
    </div>
</div>

<script>
    const API_BASE = '/api/v1';

    // 通用请求函数
    async function apiRequest(url, method, body = null) {
        const options = {
            method: method,
            headers: {
                'Content-Type': 'application/json',
            },
        };
        if (body) {
            options.body = JSON.stringify(body);
        }

        try {
            const response = await fetch(url, options);
            const data = await response.json();
            return { success: response.ok, data, status: response.status };
        } catch (error) {
            return { success: false, error: error.message };
        }
    }

    // 显示结果
    function showResult(elementId, data, isError = false) {
        const element = document.getElementById(elementId);
        element.style.display = 'block';
        element.className = `result ${isError ? 'error' : 'success'}`;
        element.innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
    }

    // 1. 创建短链接
    async function createShortLink() {
        const url = document.getElementById('createUrl').value;
        const slug = document.getElementById('createSlug').value;
        const description = document.getElementById('createDesc').value;

        if (!url) {
            showResult('createResult', { error: '请填写原始 URL' }, true);
            return;
        }

        const body = { url };
        if (slug) body.slug = slug;
        if (description) body.description = description;

        const result = await apiRequest(`${API_BASE}/short-links`, 'POST', body);
        if (result.success) {
            showResult('createResult', {
                success: '创建成功！',
                code: result.data.code,
                short_url: result.data.short_url,
                full_url: `${window.location.origin}/s/${result.data.code}`
            });
            // 清空输入
            document.getElementById('createUrl').value = '';
            document.getElementById('createSlug').value = '';
            document.getElementById('createDesc').value = '';
        } else {
            showResult('createResult', result.data || { error: '创建失败' }, true);
        }
    }

    // 2. 查询短链接详情
    async function getShortDetail() {
        const code = document.getElementById('getCode').value;
        if (!code) {
            showResult('getResult', { error: '请填写短链接 Code' }, true);
            return;
        }

        const result = await apiRequest(`${API_BASE}/short-links/${code}/detail`, 'GET');
        if (result.success) {
            showResult('getResult', {
                code: result.data.code,
                url: result.data.url,
                short_url: result.data.short_url,
                description: result.data.description,
                created_at: new Date(result.data.created_at_unix * 1000).toLocaleString()
            });
        } else {
            showResult('getResult', result.data || { error: '未找到该短链接' }, true);
        }
    }

    // 3. Ping
    async function ping() {
        const result = await apiRequest(`${API_BASE}/tools/ping`, 'GET');
        if (result.success) {
            showResult('pingResult', {
                service: result.data.service,
                version: result.data.version,
                now: result.data.now,
                status: '✅ 服务正常运行'
            });
        } else {
            showResult('pingResult', { error: 'Ping 失败' }, true);
        }
    }

    // 4. 获取时间戳
    async function getTimestamp() {
        const timezone = document.getElementById('timezone').value;
        let url = `${API_BASE}/tools/timestamp`;
        if (timezone) {
            url += `?timezone=${encodeURIComponent(timezone)}`;
        }

        const result = await apiRequest(url, 'GET');
        if (result.success) {
            showResult('timestampResult', {
                unix: result.data.unix,
                rfc3339: result.data.rfc3339,
                timezone: result.data.timezone || timezone || 'UTC',
                local_time: new Date(result.data.unix * 1000).toLocaleString()
            });
        } else {
            showResult('timestampResult', result.data || { error: '获取失败' }, true);
        }
    }

    // 5. 生成 Token
    async function generateToken() {
        let length = parseInt(document.getElementById('tokenLen').value);
        if (isNaN(length) || length < 1) length = 32;
        if (length > 1024) length = 1024;

        const result = await apiRequest(`${API_BASE}/tools/token`, 'POST', { length });
        if (result.success) {
            showResult('tokenResult', {
                token: result.data.token,
                length: result.data.length,
                hint: '请妥善保管此 Token'
            });
        } else {
            showResult('tokenResult', result.data || { error: '生成失败' }, true);
        }
    }

    // 6. 文本摘要
    async function digestText() {
        const text = document.getElementById('digestText').value;
        const algorithm = document.getElementById('digestAlgo').value;

        if (!text) {
            showResult('digestResult', { error: '请输入文本内容' }, true);
            return;
        }

        const result = await apiRequest(`${API_BASE}/tools/digest`, 'POST', { text, algorithm });
        if (result.success) {
            showResult('digestResult', {
                algorithm: result.data.algorithm,
                digest: result.data.digest,
                length: result.data.digest.length,
                input_length: text.length
            });
        } else {
            showResult('digestResult', result.data || { error: '计算失败' }, true);
        }
    }

    // 添加回车键支持
    document.getElementById('createUrl')?.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') createShortLink();
    });
    document.getElementById('getCode')?.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') getShortDetail();
    });
    document.getElementById('digestText')?.addEventListener('keypress', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            digestText();
        }
    });
</script>
</body>
</html>
